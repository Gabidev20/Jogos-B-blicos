<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Libras Bíblico</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
  .anim-erro{animation:shake .4s;background:#fecaca!important;border-color:#ef4444!important}
  .anim-ok{animation:pop .5s;background:#bbf7d0!important;border-color:#22c55e!important}
  .slot-over{outline:6px dashed #3b82f6;transform:scale(1.05)}
  .chip{touch-action:none;user-select:none}
  .btn{min-height:72px;min-width:72px}
  :focus-visible{outline:4px solid #1d4ed8;outline-offset:2px}
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
  <header class="sticky top-0 z-20 bg-white shadow flex items-center gap-3 p-3">
    <button id="btn-home" class="btn rounded-2xl bg-slate-200 text-4xl px-4" aria-label="Início">🏠</button>
    <h1 id="titulo" class="text-2xl font-extrabold flex-1">LIBRAS BÍBLICO</h1>
    <a href="index.html" class="btn rounded-2xl bg-slate-200 text-3xl px-4 flex items-center" aria-label="Meu Jogo Bíblico">📚</a>
    <div id="estrelas" class="text-3xl" aria-label="Progresso"></div>
  </header>
  <main id="app" class="max-w-4xl mx-auto p-4"></main>
  <aside id="painel" class="fixed inset-y-0 right-0 w-full sm:w-[420px] bg-white shadow-2xl z-30 translate-x-full transition-transform duration-300 overflow-y-auto p-4" aria-hidden="true">
    <button id="painel-fechar" class="btn rounded-2xl bg-slate-200 text-4xl px-4 mb-4" aria-label="Fechar">✖️</button>
    <div id="painel-corpo"></div>
  </aside>
  <script src="js/app.js"></script>
</body>
</html>
